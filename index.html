<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migul Mini App</title>
    <!-- Thư viện chuẩn của Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #f8fafc);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            margin-bottom: 10px;
            color: var(--tg-theme-button-color, #38bdf8);
        }
        p {
            color: var(--tg-theme-hint-color, #94a3b8);
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background-color: var(--tg-theme-button-color, #0284c7);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            box-sizing: border-box;
            text-align: center;
        }
        .btn-secondary {
            background-color: #334155;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔥 Free Fire IPA Hub</h2>
        <p>Chọn chức năng bên dưới để tải game hoặc lấy key.</p>
        
        <!-- Link tải IPA -->
        <a href="https://cdn.authtool.app/user_39QQInVf1DKz83SmVKQApc9ewdV/ipa/1791481884792-m3hoixtomy-Free_Fire_1.132.1_1791481685.ipa" class="btn" target="_blank">📥 Tải Free Fire IPA</a>
        
        <!-- Nút sang bot lấy key -->
        <a href="https://t.me/migulkezisbot" class="btn btn-secondary" target="_blank">🔑 Lấy Key (Sang Bot)</a>
    </div>

    <script>
        // Tự động mở rộng ứng dụng full màn hình khi bật trong Telegram
        let tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
